name: Weekly Literature Digest

on:
  schedule:
    # Every Monday at 09:10 China Standard Time.
    - cron: "10 9 * * 1"
      timezone: Asia/Shanghai
  workflow_dispatch:

jobs:
  digest:
    runs-on: ubuntu-latest
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_FROM: ${{ secrets.SMTP_FROM }}
      SMTP_USE_TLS: ${{ secrets.SMTP_USE_TLS }}
      SMTP_USE_SSL: ${{ secrets.SMTP_USE_SSL }}
      DIGEST_EMAIL_TO: ${{ secrets.DIGEST_EMAIL_TO }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Test Chinese review pipeline
        run: python -m unittest -v test_chinese_reviews
      - name: Check DeepSeek secret
        shell: bash
        run: |
          if [[ -z "${DEEPSEEK_API_KEY//[[:space:]]/}" ]]; then
            echo "::error::DEEPSEEK_API_KEY is missing or blank. Add a repository secret in Settings > Secrets and variables > Actions > Secrets (not Variables), then start a new workflow run."
            exit 1
          fi
      - name: Generate digest
        run: |
          if [ -f subscribers.json ]; then
            if [ -n "$SMTP_HOST" ]; then
              python literature_digest_agent.py --subscribers subscribers.json --config config.labor_development_econ.json --output-dir outputs --send-email
            else
              python literature_digest_agent.py --subscribers subscribers.json --config config.labor_development_econ.json --output-dir outputs
            fi
          else
            python literature_digest_agent.py --config config.labor_development_econ.json --output-dir outputs
          fi
      - name: Send digest email
        if: ${{ env.SMTP_HOST != '' && env.DIGEST_EMAIL_TO != '' && hashFiles('subscribers.json') == '' }}
        run: python literature_digest_agent.py --config config.labor_development_econ.json --email-report "outputs/digest_$(date +%F).md" --send-email
      - name: Upload digest artifact
        uses: actions/upload-artifact@v4
        with:
          name: weekly-literature-digest
          path: outputs/
